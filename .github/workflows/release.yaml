name: basebuild

on:
  # Run CI only when a PR is opened/updated and when a version tag `v*` is
  # pushed (the tag drives the draft release). Plain pushes to branches —
  # including `main` — do NOT trigger a run: the PR that introduced the change
  # already ran CI, so this avoids duplicate/redundant runs.
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # goreleaser creates the (draft) GitHub release for tags;
      # without this the default "contents: read" token fails with
      # "403 Resource not accessible by integration" on POST /releases.
      contents: write
    env:
      flags: ""
      PGTEST_HOST: localhost
      PGTEST_PORT: 5433
      PGTEST_USER: test
      PGTEST_PASSWORD: test
      PGTEST_DBNAME: pgbase_test
      # Raw core.NewBaseApp tests (base_test, log_printer_test, system_alert_test,
      # notify_watcher_test) use the production DBConnect path (PB_POSTGRES_*),
      # not the PGTEST_* harness. Point them at the same docker-compose Postgres.
      PB_POSTGRES_HOST: localhost
      PB_POSTGRES_PORT: 5433
      PB_POSTGRES_USER: test
      PB_POSTGRES_PASSWORD: test
      PB_POSTGRES_DBNAME: pgbase_test
    steps:
      - name: Checkout
        # pinned by full SHA (CFG-07); was actions/checkout@v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      # On tag pushes, publish the draft release with the latest CHANGELOG.md
      # section as its body. GoReleaser's own changelog is disabled in
      # .goreleaser.yaml, so we extract the top-most "## " section and hand it
      # to GoReleaser via --release-notes. `flags` starts empty, so this is the
      # only added flag on tag runs (this step only runs on tags anyway).
      # Write the notes to $RUNNER_TEMP (outside the repo) so the working tree
      # stays clean — `goreleaser release --clean` aborts on any dirty/untracked
      # file (https://goreleaser.com/errors/dirty).
      # Must run after Checkout so CHANGELOG.md is present in the workspace.
      - name: Prepare release notes from CHANGELOG.md
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          awk 'f&&/^## /{exit} /^## /{f=1;next} f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          echo "flags=--release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Set up Node.js
        # pinned by full SHA (CFG-07); was actions/setup-node@v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '>=25.2.1'

      - name: Set up Go
        # pinned by full SHA (CFG-07); was actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '>=1.26.5'

      # This step usually is not needed because the /ui/dist is pregenerated locally
      # but its here to ensure that each release embeds the latest admin ui artifacts.
      # If the artificats differs, a "dirty error" is thrown - https://goreleaser.com/errors/dirty/
      - name: Build Admin dashboard UI
        run: npm --prefix=./ui ci && npm --prefix=./ui run build

      # Temporary disable as the types can have random generated identifiers making it non-deterministic.
      #
      # # Similar to the above, the jsvm types are pregenerated locally
      # # but its here to ensure that it wasn't forgotten to be executed.
      # - name: Generate jsvm types
      #   run: go run ./plugins/jsvm/internal/types/types.go

      - name: Start Postgres
        run: docker compose -f tests/docker-compose.test.yml up -d --wait

      # The native PostgreSQL backup/restore path shells out to pg_dump /
      # pg_restore. Install the v16 client so it matches the postgres:16-alpine
      # test server (pg_dump refuses to dump a newer server, so the client major
      # must be >= the server major). Without this, TestPGDumpExportImportRoundTrip
      # skips instead of exercising the native default format.
      - name: Install PostgreSQL 16 client (pg_dump / pg_restore)
        run: |
          set -euo pipefail
          if ! sudo apt-get update && sudo apt-get install -y postgresql-client-16; then
            # fall back to the official PGDG apt repo if the base image no
            # longer ships postgresql-client-16 in its default repositories
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
            echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          pg_dump --version
          pg_restore --version

      - name: Run tests
        # Database-per-test isolation (see tests/app.go) makes parallel package
        # runs deterministic, so -p 1 is no longer required. -p 4 bounds package
        # parallelism to keep any single heavy package (core/apis) under the
        # per-package test timeout even on beefier runners; the extended
        # -timeout adds margin on slower CI CPUs.
        run: go test ./... -count=1 -p 4 -timeout=1200s

      - name: Cross-compile check (32-bit targets)
        # The test phase only compiles for the runner's native 64-bit
        # architecture, so 32-bit-only errors (eg. untyped int constants
        # overflowing the 32-bit int range) would otherwise surface only
        # ~1 minute into the GoReleaser build. linux/arm (armv7) is the
        # only 32-bit target in .goreleaser.yaml, so build it upfront here.
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build ./...

      - name: Run GoReleaser
        # Only build/publish the release on version tags. PR runs just need the
        # test phase above (this also avoids using the contents:write token
        # outside release contexts).
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        # pinned by full SHA (CFG-07); was goreleaser/goreleaser-action@v6
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
