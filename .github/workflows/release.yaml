name: basebuild

on:
  pull_request:
  push:

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # goreleaser creates the (draft) GitHub release for tags;
      # without this the default "contents: read" token fails with
      # "403 Resource not accessible by integration" on POST /releases.
      contents: write
    env:
      flags: ""
      PGTEST_HOST: localhost
      PGTEST_PORT: 5433
      PGTEST_USER: test
      PGTEST_PASSWORD: test
      PGTEST_DBNAME: pgbase_test
      # Raw core.NewBaseApp tests (base_test, log_printer_test, system_alert_test,
      # notify_watcher_test) use the production DBConnect path (PB_POSTGRES_*),
      # not the PGTEST_* harness. Point them at the same docker-compose Postgres.
      PB_POSTGRES_HOST: localhost
      PB_POSTGRES_PORT: 5433
      PB_POSTGRES_USER: test
      PB_POSTGRES_PASSWORD: test
      PB_POSTGRES_DBNAME: pgbase_test
    steps:
      # re-enable auto-snapshot from goreleaser-action@v3
      # (https://github.com/goreleaser/goreleaser-action-v4-auto-snapshot-example)
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=25.2.1'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.26.5'

      # This step usually is not needed because the /ui/dist is pregenerated locally
      # but its here to ensure that each release embeds the latest admin ui artifacts.
      # If the artificats differs, a "dirty error" is thrown - https://goreleaser.com/errors/dirty/
      - name: Build Admin dashboard UI
        run: npm --prefix=./ui ci && npm --prefix=./ui run build

      # Temporary disable as the types can have random generated identifiers making it non-deterministic.
      #
      # # Similar to the above, the jsvm types are pregenerated locally
      # # but its here to ensure that it wasn't forgotten to be executed.
      # - name: Generate jsvm types
      #   run: go run ./plugins/jsvm/internal/types/types.go

      - name: Start Postgres
        run: docker compose -f tests/docker-compose.test.yml up -d --wait

      - name: Run tests
        # Database-per-test isolation (see tests/app.go) makes parallel package
        # runs deterministic, so -p 1 is no longer required. -p 4 bounds package
        # parallelism to keep any single heavy package (core/apis) under the
        # per-package test timeout even on beefier runners; the extended
        # -timeout adds margin on slower CI CPUs.
        run: go test ./... -count=1 -p 4 -timeout=1200s

      - name: Cross-compile check (32-bit targets)
        # The test phase only compiles for the runner's native 64-bit
        # architecture, so 32-bit-only errors (eg. untyped int constants
        # overflowing the 32-bit int range) would otherwise surface only
        # ~1 minute into the GoReleaser build. linux/arm (armv7) is the
        # only 32-bit target in .goreleaser.yaml, so build it upfront here.
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build ./...

      - name: Run GoReleaser
        # Skip the release build on pull requests and non-main branch pushes:
        # they only need the test phase above (this also avoids using the
        # contents:write token outside release contexts).
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
