name: docker-latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (e.g. v0.5.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull immutable tag and re-tag as :latest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pgbase"
          TAG="${{ steps.resolve.outputs.tag }}"

          docker pull "$IMAGE:$TAG"
          docker tag  "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

          echo "Promoted $IMAGE:$TAG → $IMAGE:latest"
