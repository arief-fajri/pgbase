name: Decision request (Level B)
description: Request an explicit human confirmation under the AI decision-authority model (docs/contributor/methodology/guardrails.md §8). The change stays blocked until a maintainer confirms. Silence is not approval.
title: "DRR: <short decision summary>"
labels: [decision-waiting]
body:
  - type: input
    id: guardrails
    attributes:
      label: Guard rails / invariants implicated
      description: G-# / I# references (BLANK or "none crossed" is not valid for B-level decisions — state "none, because <reason>").
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Decision context
      description: What is being decided, why now, and what product context applies.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: Alternatives with trade-offs.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option the requester recommends and why.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks / reversibility
      description: Blast radius, reversibility, rollback path, and agreed acceptance evidence.
    validations:
      required: true

# Level B: remains open until an explicit maintainer confirmation.
# Silence is not approval. Record the outcome in evidence/records/
# (decision number = this issue number).