version: 2

project_name: pgbase

dist: .builds

before:
  hooks:
    - go mod tidy

builds:
  - id: build_noncgo
    main: ./examples/base
    binary: pgbase
    ldflags:
      - -s -w -X github.com/arief-fajri/pgbase.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

release:
  draft: true

archives:
  - id: archive_noncgo
    builds: [build_noncgo]
    format: zip
    files:
      - LICENSE.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# NOTE: the changelog pipe is intentionally left ENABLED (no `changelog.disable`).
# The release workflow passes `--release-notes=<top CHANGELOG.md section>`, and
# GoReleaser loads that file *inside the changelog pipe* — so disabling the pipe
# would also drop the release notes and leave the GitHub release body empty.
# With a non-empty `--release-notes`, GoReleaser uses the file verbatim and skips
# the git-log changelog, so no pre-fork PocketBase history is pulled in.
