# One-command trial stack for PG-BASE (Sprint 0a quickstart).
#
# This file is fetched by deploy/quickstart.sh — you do not need the repo.
# It boots PG-BASE + PostgreSQL with a single `docker compose up -d` and is
# fully self-contained: the pgcrypto extension PG-BASE requires before first
# boot is created via the inline `configs` block (no repo files to mount).
#
# Requirements: Docker Engine + Docker Compose v2.23.1+ (inline `configs`).
#
# SECURITY: ships no default credentials — set PB_POSTGRES_PASSWORD (the
# quickstart script generates one for you; plain compose fails fast without
# it). For production use docs/production.md instead of this trial stack.
#
# The Postgres image is pgvector/pgvector:pg16 — the official postgres:16
# image with the pgvector extension preinstalled. PG-BASE's vector features
# are roadmap work (Sprint 0b); pre-creating the extension now means this
# stack keeps working unchanged when they land. Plain postgres:16 works too.
#
services:
  pgbase:
    image: ghcr.io/arief-fajri/pgbase:${PGBASE_VERSION:-latest}
    ports:
      - "${PGBASE_PORT:-8090}:8090"
    environment:
      - PB_POSTGRES_HOST=postgres
      - PB_POSTGRES_PORT=5432
      - PB_POSTGRES_USER=${PB_POSTGRES_USER:-pgbase}
      - PB_POSTGRES_PASSWORD=${PB_POSTGRES_PASSWORD:?set PB_POSTGRES_PASSWORD in .env (see deploy/quickstart.sh)}
      - PB_POSTGRES_DBNAME=${PB_POSTGRES_DBNAME:-pgbase}
      - PB_POSTGRES_SSLMODE=disable
      # settings encryption key — generated by quickstart.sh; leave empty only
      # for throwaway trials (see .env.example in the repo for the full story)
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-}
    volumes:
      - pb_data:/pb_data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${PB_POSTGRES_DBNAME:-pgbase}
      POSTGRES_USER: ${PB_POSTGRES_USER:-pgbase}
      POSTGRES_PASSWORD: ${PB_POSTGRES_PASSWORD:?set PB_POSTGRES_PASSWORD in .env (see deploy/quickstart.sh)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # pgcrypto is REQUIRED before PG-BASE's first boot (the aux + data
    # bootstrap deadlocks without it — see docs/fork-deltas.md); vector is
    # pre-created for the roadmap vector features. Self-contained via the
    # inline configs block below — no repo checkout needed.
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/01-init.sql
    # The database port is deliberately NOT published: the app talks to it
    # over the compose network, and publishing it would collide with any
    # Postgres already running on the host. Debug access instead:
    #   docker compose exec postgres psql -U pgbase -d pgbase
    healthcheck:
      # TCP probe on purpose: the unix-socket default reports healthy during
      # the initdb phase (temp server) before the init scripts have run,
      # which would let PG-BASE boot before pgcrypto exists.
      test: ["CMD-SHELL", "pg_isready -U ${PB_POSTGRES_USER:-pgbase} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pb_data:
  postgres_data:

configs:
  pg_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS pgcrypto;
      CREATE EXTENSION IF NOT EXISTS vector;
