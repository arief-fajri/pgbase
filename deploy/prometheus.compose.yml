# Prometheus config used INSIDE docker-compose.monitoring.yml, where prometheus
# shares the compose network and must reach the pgbase service by name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pgbase
    metrics_path: /metrics
    static_configs:
      - targets: ["pgbase:9090"]
        labels:
          service: pgbase