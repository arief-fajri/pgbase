# Prometheus config for scraping the pgbase /metrics endpoint.
#
# For a single-host prod-compose setup, enable the metrics listener on the
# pgbase service (see docker-compose.prod.yml / https://arief-fajri.github.io/pgbase/production) and publish it
# loopback-only, then set the target below to 127.0.0.1:9090 (host) or
# pgbase:9090 (if this runs as a compose service sharing the network).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pgbase
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: pgbase