services:
  postgres-test:
    # Overridable so the PG16/17 CI matrix (release.yaml "pg-matrix" job) and
    # local verification runs can target a different engine major, eg.
    #   TEST_POSTGRES_IMAGE=postgres:17-alpine docker compose -f tests/docker-compose.test.yml up -d --wait
    # The default stays postgres:16-alpine, so plain `make test` and local
    # development are unaffected.
    image: ${TEST_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: pgbase_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c max_connections=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d pgbase_test"]
      interval: 5s
      timeout: 5s
      retries: 10
