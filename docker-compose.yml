# Local / demo docker-compose for pgbase.
#
# SECURITY: this file ships NO default credentials. Copy `.env.example` to
# `.env` and set a strong PB_POSTGRES_PASSWORD (e.g. `openssl rand -base64 32`)
# before `docker compose up` — compose fails fast if it is unset.
#
# The postgres port is published on 127.0.0.1 only, so the database is not
# reachable from the network. For PRODUCTION:
#   - point PB_POSTGRES_* at a managed/TLS-enabled Postgres and set
#     PB_POSTGRES_SSLMODE=require (or verify-full);
#   - do NOT expose the database port publicly;
#   - run the app behind a TLS-terminating reverse proxy;
#   - keep secrets in a real secret store, not a committed file.
version: '3.8'
services:
  pgbase:
    build: .
    ports:
      - "8090:8090"
    environment:
      - PB_POSTGRES_HOST=postgres
      - PB_POSTGRES_PORT=5432
      - PB_POSTGRES_USER=${PB_POSTGRES_USER:-pgbase}
      - PB_POSTGRES_PASSWORD=${PB_POSTGRES_PASSWORD:?set PB_POSTGRES_PASSWORD in .env (see .env.example)}
      - PB_POSTGRES_DBNAME=${PB_POSTGRES_DBNAME:-pgbase}
      - PB_POSTGRES_SSLMODE=${PB_POSTGRES_SSLMODE:-disable}
      # settings encryption key (see .env.example); encrypted at rest when set
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-}
    volumes:
      - pb_data:/pb_data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # Raise max_connections above the pgbase pool ceiling (data + aux open
    # conns, ~90 by default) so multiple instances / raised pool env vars still
    # fit with headroom for superuser/maintenance sessions. For large fan-out,
    # front Postgres with PgBouncer (see DEV.md). Tune the pool via the
    # PB_POSTGRES_*_MAX_*_CONNS env vars on the pgbase service.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${PB_POSTGRES_DBNAME:-pgbase}
      POSTGRES_USER: ${PB_POSTGRES_USER:-pgbase}
      POSTGRES_PASSWORD: ${PB_POSTGRES_PASSWORD:?set PB_POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    # Bound to 127.0.0.1 so the database is never exposed to the network.
    ports:
      - "127.0.0.1:${PB_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PB_POSTGRES_USER:-pgbase}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pb_data:
  postgres_data:
